name: Update Fuel Prices Daily

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '23 10 * * *'
    - cron: '37 16 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force commit/redeploy even if CSV appears unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: update-fuel-prices
  cancel-in-progress: false

jobs:
  update-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Download and validate latest GOV fuel CSV
        shell: bash
        run: |
          set -euo pipefail

          CSV_URL="https://www.fuel-finder.service.gov.uk/internal/v1.0.2/csv/get-latest-fuel-prices-csv"
          TEMP_FILE="data/fuel_data.new.csv"
          CURRENT_FILE="data/fuel_data.csv"
          FORCE_UPDATE="${{ github.event.inputs.force_update || 'false' }}"

          echo "Checking GOV fuel CSV at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Force update: ${FORCE_UPDATE}"

          HTTP_CODE=$(curl --silent --show-error --location \
            --connect-timeout 15 \
            --max-time 60 \
            --header "Cache-Control: no-cache" \
            --header "Pragma: no-cache" \
            --user-agent "Mozilla/5.0 DriverzUKFuelUpdater/1.0 (+https://driverz.uk/contact.html)" \
            --write-out "%{http_code}" \
            "$CSV_URL" \
            --output "$TEMP_FILE")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "GOV CSV download failed with HTTP ${HTTP_CODE}."
            echo "Keeping existing CSV."
            rm -f "$TEMP_FILE"
            exit 0
          fi

          if [ ! -s "$TEMP_FILE" ]; then
            echo "Downloaded file is empty."
            rm -f "$TEMP_FILE"
            exit 1
          fi

          LINE_COUNT=$(wc -l < "$TEMP_FILE")
          BYTE_COUNT=$(wc -c < "$TEMP_FILE")

          echo "Downloaded CSV lines: ${LINE_COUNT}"
          echo "Downloaded CSV bytes: ${BYTE_COUNT}"
          echo "Downloaded CSV SHA256:"
          sha256sum "$TEMP_FILE"

          if [ -f "$CURRENT_FILE" ]; then
            echo "Current repo CSV SHA256:"
            sha256sum "$CURRENT_FILE"
          fi

          if [ "$LINE_COUNT" -lt 50 ] || [ "$BYTE_COUNT" -lt 10000 ]; then
            echo "Downloaded CSV looks too small. Not updating."
            rm -f "$TEMP_FILE"
            exit 1
          fi

          HEADER=$(head -n 1 "$TEMP_FILE")

          echo "CSV header:"
          echo "$HEADER"

          if ! echo "$HEADER" | grep -q "forecourts.location.latitude" || \
             ! echo "$HEADER" | grep -q "prices.E10" || \
             ! echo "$HEADER" | grep -q "prices.B7"; then
            echo "Downloaded CSV header does not look like expected fuel data."
            rm -f "$TEMP_FILE"
            exit 1
          fi

          if [ -f "$CURRENT_FILE" ] && cmp -s "$TEMP_FILE" "$CURRENT_FILE" && [ "$FORCE_UPDATE" != "true" ]; then
            echo "Fuel CSV unchanged. No commit needed."
            rm -f "$TEMP_FILE"
            exit 0
          fi

          mv "$TEMP_FILE" "$CURRENT_FILE"

          if [ "$FORCE_UPDATE" = "true" ]; then
            date -u '+%Y-%m-%dT%H:%M:%SZ' > data/force_refresh.txt
          fi

          echo "CSV update step complete."

      - name: Commit only if fuel data changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/fuel_data.csv ]; then
            git add data/fuel_data.csv
          fi

          if [ -f data/force_refresh.txt ]; then
            git add data/force_refresh.txt
          fi

          if git diff --cached --quiet; then
            echo "Fuel data unchanged. No commit needed."
            exit 0
          fi

          git commit -m "Update fuel prices"
          git push
