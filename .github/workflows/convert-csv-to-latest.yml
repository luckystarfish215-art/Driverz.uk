name: Convert CSV to Latest JSON

on:
  push:
    paths:
      - "data/fuel_data.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: driverz-main-writer
  cancel-in-progress: false

jobs:
  convert-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert CSV to latest.json
        run: python scripts/convert_csv_to_latest.py

      - name: Commit latest data
        run: |
          set -euo pipefail

          git config user.name "driverz-bot"
          git config user.email "actions@github.com"

          git add \
            data/latest.json \
            data/latest-status.json

          if git diff --cached --quiet; then
            echo "No latest-data changes to commit."
            exit 0
          fi

          git commit -m "Convert fuel CSV to latest JSON"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict. Refusing to overwrite remote changes."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts."
          exit 1
