name: Test Google Trends Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test Google Trends endpoints
        shell: python
        run: |
          import urllib.error
          import urllib.request

          urls = [
              "https://trends.google.com/",
              "https://trends.google.com/trends/explore?geo=GB",
          ]

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "Chrome/120.0 Safari/537.36"
              ),
              "Accept-Language": "en-GB,en;q=0.9",
          }

          for url in urls:
              print()
              print("Testing:", url)

              request = urllib.request.Request(
                  url,
                  headers=headers,
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:
                      body = response.read(200)

                      print("HTTP:", response.status)
                      print(
                          "Content-Type:",
                          response.headers.get("Content-Type"),
                      )
                      print("First bytes:", repr(body[:100]))

              except urllib.error.HTTPError as exc:
                  print("HTTP ERROR:", exc.code)
                  print("Headers:", dict(exc.headers))

              except Exception as exc:
                  print(
                      "ERROR:",
                      type(exc).__name__,
                      str(exc),
                  )
